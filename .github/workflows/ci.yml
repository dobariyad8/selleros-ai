name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      APP_URL: http://localhost:3000

      ETSY_API_KEY: test_etsy_api_key
      ETSY_SHARED_SECRET: test_etsy_shared_secret
      ETSY_REDIRECT_URI: http://localhost:3000/api/auth/etsy/callback

      OPENAI_API_KEY: test_openai_api_key

      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: test_supabase_secret_key

      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test_supabase_publishable_key

      CRON_SECRET: test_cron_secret

      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_PRO_PRICE_ID: price_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build